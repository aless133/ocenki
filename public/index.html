<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Оценки детей</title>
  <link rel="stylesheet" href="/assets/bootstrap.min.css">
</head>
<body class="bg-body-tertiary">
  <main class="container py-5">
    <div class="row justify-content-center">
      <section class="col-12 col-md-8 col-lg-6" aria-labelledby="title">
        <h1 id="title" class="mb-2">Оценки детей</h1>
        <p id="description" class="text-body-secondary">Выберите, чьи оценки хотите посмотреть.</p>
        <a id="back" class="btn btn-outline-secondary mt-3 d-none" href="/">← Все дети</a>
        <nav id="children" class="list-group mt-4 d-none" aria-label="Дети"></nav>
        <p id="status" class="alert alert-info mt-4" role="status">Загрузка списка…</p>
        <button id="retry" class="btn btn-primary d-none" type="button">Повторить вход</button>
      </section>
    </div>
  </main>
  <script>
    const list = document.querySelector('#children');
    const status = document.querySelector('#status');
    const retry = document.querySelector('#retry');
    let childId;
    let polling;

    function showSession(session) {
      const busy = ['opening', 'student', 'login'].includes(session.state);
      status.className = `alert mt-4 ${session.state === 'error' ? 'alert-danger' : 'alert-info'}`;
      status.replaceChildren();
      status.setAttribute('aria-busy', String(busy));
      if (busy) {
        const spinner = document.createElement('span');
        spinner.className = 'spinner-border spinner-border-sm me-2';
        spinner.setAttribute('aria-hidden', 'true');
        status.append(spinner);
      }
      status.append(document.createTextNode(session.message));
      retry.classList.toggle('d-none', session.state !== 'error');
      if (busy) polling = setTimeout(pollSession, 1000);
    }

    function showError(message) {
      showSession({ state: 'error', message });
    }

    async function sessionRequest(path, method = 'GET') {
      const response = await fetch(`/${encodeURIComponent(childId)}/session${path}`, { method });
      if (!response.ok) throw new Error('Не удалось связаться с локальным сервером. Обновите страницу.');
      return response.json();
    }

    async function pollSession() {
      try { showSession(await sessionRequest('')); }
      catch (error) { showError(error.message); }
    }

    async function startSession(isRetry = false) {
      clearTimeout(polling);
      showSession({ state: 'opening', message: 'Ждите: открываем сайт ученика в новой вкладке…' });
      clearTimeout(polling);
      try { showSession(await sessionRequest(isRetry ? '/retry' : '', 'POST')); }
      catch (error) { showError(error.message); }
    }

    retry.addEventListener('click', () => startSession(true));

    async function loadChildren() {
      try {
        const response = await fetch('/api/children');
        if (!response.ok) throw new Error('Не удалось загрузить список. Проверьте файлы .env в private/children/ и обновите страницу.');
        const children = await response.json();
        if (location.pathname !== '/') {
          document.querySelector('#back').classList.remove('d-none');
          document.querySelector('#description').hidden = true;
          const child = children.find((item) => `/${item.id}` === location.pathname.replace(/\/+$/, ''));
          if (!child) throw new Error('Ребёнок не найден.');
          document.querySelector('h1').textContent = `Оценки: ${child.alias}`;
          document.title = `Оценки: ${child.alias}`;
          childId = child.id;
          await startSession();
          return;
        }
        if (children.length === 0) {
          status.textContent = 'Список пока пуст. Добавьте файл .env для каждого ребёнка в private/children/ и обновите страницу.';
          return;
        }
        for (const child of children) {
          const link = document.createElement('a');
          link.className = 'list-group-item list-group-item-action py-3 text-break';
          link.href = `/${encodeURIComponent(child.id)}`;
          link.textContent = child.alias;
          list.append(link);
        }
        list.classList.remove('d-none');
        status.hidden = true;
      } catch (error) {
        status.classList.replace('alert-info', 'alert-danger');
        status.textContent = error.message;
      }
    }

    loadChildren();
  </script>
</body>
</html>
